<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Birthday Party Patrol — Luna's Story Time</title>
<meta name="description" content="A multiplayer birthday game for up to 4 friends: guard the goodies at Castle Everstair — or sneak off with them!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Berkshire+Swash&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/party.css">
</head>
<body class="game-body party-body">

<header class="game-top">
  <a class="home-link" href="index.html" aria-label="Back to the bookshelf">🌙 Home</a>
  <h1 class="game-title">The Birthday Party Patrol</h1>
  <div class="top-actions">
    <span class="hud-chip" title="Party countdown">⏰ <b id="hudClock">5:00</b></span>
    <span class="hud-chip" title="Goodies still on the table">🎁 <b id="hudGoodies">10</b></span>
    <span class="hud-chip" title="Your team's magic">✨ <b id="hudPool">0</b></span>
    <button type="button" id="btnSound" class="chip-btn icon-chip" aria-pressed="true" aria-label="Turn sound off" title="Sound is on">🔊</button>
    <button type="button" id="btnLeave" class="chip-btn icon-chip" aria-label="Leave the party" title="Leave the party" hidden>🚪</button>
  </div>
</header>

<main class="game-main">
  <section class="stage-wrap">
    <!-- Phaser mounts its canvas in here -->
    <div id="mapView" class="map-view" role="img" aria-label="A sunny castle garden set for a birthday party, seen from above"></div>

    <!-- Team action bar: build/send buttons, filled per side by js/party.js -->
    <div id="actionBar" class="action-bar" hidden></div>

    <!-- Big friendly event banner ("Wave incoming!", "Goodie saved!") -->
    <div id="bannerBubble" class="banner-bubble" role="status" hidden></div>

    <!-- Lobby / join / game-over overlays, filled by js/party.js -->
    <div id="overlay" class="party-overlay">
      <div id="overlayCard" class="party-card"></div>
    </div>
  </section>
</main>

<footer class="game-footer">
  <a href="index.html">🌙 Back to the storybooks</a>
</footer>

<script src="js/vendor/phaser.min.js" defer></script>
<script src="js/party.js" defer></script>
</body>
</html>
