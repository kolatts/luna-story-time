<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Princess Moon's Castle Life — Luna's Story Time</title>
<meta name="description" content="A cozy no-fail gather, craft, and decorate game set in Princess Moon's castle world.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Berkshire+Swash&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body class="game-body">

<header class="game-top">
  <a class="home-link" href="index.html" aria-label="Back to the bookshelf">🌙 Home</a>
  <h1 class="game-title">Princess Moon's Castle Life</h1>
  <div class="top-actions"><button type="button" id="btnSound" class="chip-btn icon-chip" aria-pressed="true" aria-label="Turn voices off" title="Voices are on">🔊</button><button type="button" id="btnReset" class="chip-btn">Start over</button></div>
</header>

<main class="game-main">
  <section class="stage-wrap">
    <div class="location-banner" id="locationName"></div>
    <!-- Phaser mounts its canvas in here -->
    <div id="mapView" class="map-view" role="img" aria-label="Princess Moon's world"></div>
    <div id="dialogueBox" class="dialogue-box" role="dialog" aria-label="Conversation" hidden>
      <div class="dialogue-portrait" id="dialoguePortrait"></div>
      <div class="dialogue-text" id="dialogueText"></div>
      <button type="button" id="dialogueNext" class="cta small">Next ✨</button>
    </div>
    <div id="toast" class="toast" hidden></div>
    <!-- Touch controls sit ON the stage (same box as #mapView) and are
         pointer-events:none apart from the action button, so canvas taps for
         placing furniture still reach Phaser. -->
    <div class="touch-controls" id="touchControls">
      <div class="stick" id="touchStick" aria-hidden="true"><span class="stick-nub" id="touchStickNub"></span></div>
      <button type="button" id="btnAction" class="action-btn" aria-label="Gather or interact">✨</button>
    </div>
  </section>

  <!-- Each panel collapses from its own heading (js/game.js wires the toggles
       and remembers the open/closed set in localStorage). -->
  <aside class="hud">
    <section class="hud-panel" id="inventoryPanel" data-panel="inventory">
      <h2><button type="button" class="panel-toggle" aria-expanded="true" aria-controls="inventoryBody"><span class="panel-name">Satchel</span><span class="chev" aria-hidden="true"></span></button></h2>
      <div class="panel-body" id="inventoryBody">
        <div class="inv-grid" id="invGrid"></div>
      </div>
    </section>
    <section class="hud-panel" id="craftPanel" data-panel="craft">
      <h2><button type="button" class="panel-toggle" aria-expanded="true" aria-controls="craftBody"><span class="panel-name">Crafting</span><span class="chev" aria-hidden="true"></span></button></h2>
      <div class="panel-body" id="craftBody">
        <div id="recipeList"></div>
      </div>
    </section>
    <section class="hud-panel" id="furniturePanel" data-panel="furniture">
      <h2><button type="button" class="panel-toggle" aria-expanded="true" aria-controls="furnitureBody"><span class="panel-name">Furniture</span><span class="chev" aria-hidden="true"></span></button></h2>
      <div class="panel-body" id="furnitureBody">
        <div id="furnList"></div>
        <p class="hint" id="decorHint" hidden>Tap a furniture piece, then tap a floor tile to place it 💫</p>
      </div>
    </section>
  </aside>
</main>

<footer class="game-footer">
  <a href="index.html">🌙 Back to the storybooks</a>
</footer>

<div id="confirmModal" class="modal" hidden>
  <div class="modal-card">
    <p id="confirmText">Start over from the very beginning? Your castle will be empty again.</p>
    <div class="modal-actions">
      <button type="button" id="confirmYes" class="cta">Yes, start over</button>
      <button type="button" id="confirmNo" class="cta ghost">Keep my castle</button>
    </div>
  </div>
</div>

<script src="js/vendor/phaser.min.js" defer></script>
<script src="js/game.js" defer></script>
</body>
</html>
